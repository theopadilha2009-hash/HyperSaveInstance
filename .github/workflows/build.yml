name: Build & Validate HyperSaveInstance

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Standalone Bundle
        run: npm run build

      - name: Run Master Audit & Roblox Runtime Simulation
        run: npm test

      - name: Upload Production Bundle
        uses: actions/upload-artifact@v4
        with:
          name: HyperSaveInstance-Bundle
          path: dist/HyperSaveInstance.luau
